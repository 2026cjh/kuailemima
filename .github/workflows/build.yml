name: 编译安卓安装包

on:
  push:
    branches: [main]
    paths-ignore:
      - 'design/**'
      - '**.md'
  workflow_dispatch:

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 规则测试
        run: node test/games.test.js && node test/ocr.test.js

      - name: 准备网页资源并同步到安卓工程
        run: |
          node tools/prepare.js
          npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: 安卓 SDK 许可（用机器上预装的 SDK）
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true

      - name: 签名证书（来自仓库加密 Secrets：KEYSTORE_BASE64、KEYSTORE_PASSWORD）
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::warning::没有签名证书 Secrets，这次只编译测试版（debug）"
            echo "SIGN=0" >> $GITHUB_ENV; exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
          printf "storeFile=release.jks\nstorePassword=%s\nkeyAlias=hongbo\nkeyPassword=%s\n" "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" > android/keystore.properties
          echo "SIGN=1" >> $GITHUB_ENV

      - name: 编译
        working-directory: android
        run: |
          chmod +x gradlew
          if [ "$SIGN" = "1" ]; then ./gradlew assembleRelease --no-daemon --stacktrace; else ./gradlew assembleDebug --no-daemon --stacktrace; fi

      - name: 整理安装包
        run: |
          if [ "$SIGN" = "1" ]; then cp android/app/build/outputs/apk/release/app-release.apk "kuailemima-1.0.${{ github.run_number }}.apk"
          else cp android/app/build/outputs/apk/debug/app-debug.apk "kuailemima-1.0.${{ github.run_number }}-debug.apk"; fi

      - uses: actions/upload-artifact@v4
        with:
          name: kuailemima-apk
          path: kuailemima-*.apk

      - name: 发布到 Releases
        if: env.SIGN == '1'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: 快乐密码 1.0.${{ github.run_number }}
          body: 安卓安装包，下载后在手机上打开安装。
          files: kuailemima-1.0.${{ github.run_number }}.apk
