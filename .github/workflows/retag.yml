name: 版本标签指向整理后的提交

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/retag.yml'

jobs:
  retag:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 移动标签
        run: |
          set -euo pipefail
          git config user.name "2026cjh"
          git config user.email "2026cjh@users.noreply.github.com"
          move() { git cat-file -e "$2^{commit}"; git tag -f "$1" "$2"; git push -f origin "refs/tags/$1"; echo "$1 -> $2"; }
          move v1.0.4 cbddddfca9f10ebb2ed73a643c8b5b42cc4137f5
          move v1.0.5 8a14336785d5c65ee3ae3d44f092fc941267c0d9
          move v1.0.8 8a14336785d5c65ee3ae3d44f092fc941267c0d9
